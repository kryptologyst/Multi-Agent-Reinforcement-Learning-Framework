# Default configuration for Multi-Agent Reinforcement Learning

env:
  grid_size: 8
  num_agents: 2
  num_goals: 2
  max_steps: 100
  collision_penalty: -0.1
  goal_reward: 1.0
  step_penalty: -0.01

training:
  total_timesteps: 100000
  learning_rate: 3e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  
  # MAPPO specific
  use_centralized_value: true
  use_gae: true
  normalize_advantages: true

evaluation:
  n_eval_episodes: 100
  n_eval_seeds: 5
  confidence_level: 0.95
  save_plots: true
  plot_dir: "assets/plots"

logging:
  log_level: "INFO"
  save_checkpoints: true
  checkpoint_frequency: 10000
  tensorboard_log: "logs/tensorboard"

# Safety and reproducibility
safety:
  max_wall_clock_time: 3600  # 1 hour
  deterministic_evaluation: true
  reproducible_seeds: true

# Advanced configurations for different scenarios
scenarios:
  cooperative:
    env:
      collision_penalty: -0.1
      goal_reward: 1.0
      step_penalty: -0.01
    
  competitive:
    env:
      collision_penalty: -0.5
      goal_reward: 2.0
      step_penalty: -0.02
    
  mixed:
    env:
      collision_penalty: -0.2
      goal_reward: 1.5
      step_penalty: -0.015
